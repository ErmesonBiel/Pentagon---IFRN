<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pentagon - Perfil</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-profile">

  <div class="shape-container">
    <div class="shape pentagon-spin"></div>
    <div class="shape pentagon-orbit"></div>
    <div class="shape pentagon-pulse"></div>
  </div>

  <header class="navbar">
    <a href="dashboard.html" class="logo-container">Pentagon.</a>
    <nav>
      <a href="dashboard.html">PAINEL</a>
      <a href="ranking.html">RANKING</a>
      <a href="partidas.html">PARTIDAS</a>
      <a href="perfil.html" class="active">PERFIL</a>
    </nav>
  </header>

  <main class="dashboard">
    <div class="dashboard-content">
      
      <div class="ranking-header">
        <h1 class="page-title-cyber">MEU PERFIL</h1>
        <div class="cyber-line"></div>
      </div>

      <div class="table-container profile-container">
        
        <div class="profile-header-info">
          <div class="avatar-placeholder">👤</div>
          <h2 id="userNome" class="user-name">Carregando...</h2>
          <p id="userEmail" class="user-email">email@exemplo.com</p>
        </div>

        <div class="profile-status-grid">
          <div class="status-box">
            <span class="status-label">Status da Conta</span>
            <span class="status-value status-active">Ativo</span>
          </div>
          <div class="status-box">
            <span class="status-label">Tipo de Acesso</span>
            <span class="status-value">Organizador / Jogador</span>
          </div>
        </div>

        <div class="history-section">
          <h3 class="history-title">Partidas Recentes (Jogador)</h3>
          <ul id="historicoJogador" class="history-list">
            <li class="history-item">Carregando partidas...</li>
          </ul>

          <h3 class="history-title" style="margin-top: 30px;">Partidas Ministradas (Organizador)</h3>
          <ul id="historicoOrganizador" class="history-list">
            <li class="history-item">Carregando partidas...</li>
          </ul>
        </div>

      </div>

    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>

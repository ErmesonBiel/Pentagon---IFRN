<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pentagon - Perfil</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="dashboard.html" class="logo-container">Pentagon.</a>
    <nav>

      <a href="partidas.html">PARTIDAS</a>

      <h3 style="margin-bottom: 15px;">Histórico de Partidas Recentes</h3>
      <ul id="historicoPerfil" style="list-style: none; padding: 0;">
        <li style="padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1);">Carregando histórico...</li>

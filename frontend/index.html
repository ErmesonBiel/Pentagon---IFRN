<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pentagon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-auth">

  <div class="shape-container">
    <div class="shape pentagon-spin"></div>
    <div class="shape pentagon-orbit"></div>
    <div class="shape pentagon-pulse"></div>
  </div>

  <header class="navbar">
    <a href="index.html" class="logo-container">Pentagon.</a>
    <nav>
      <a href="sobrenos.html">SOBRE NÓS</a>
      <a href="index.html" class="active">ENTRAR</a>
    </nav>
  </header>

  <main class="dashboard">
    <div class="dashboard-content">
      
      <div class="table-container auth-card">
        
        <div class="auth-tabs">
          <button type="button" id="tabLogin" class="auth-tab active">Entrar</button>
          <button type="button" id="tabCadastro" class="auth-tab">Criar Conta</button>
        </div>

        <form id="formLogin" class="auth-form">
          <h2 class="auth-title">Bem-vindo de volta!</h2>
          <p class="auth-subtitle">Aceda à sua conta para continuar.</p>

          <div class="input-group">
            <label for="loginEmail">Endereço de E-mail</label>
            <input type="email" id="loginEmail" placeholder="seuemail@exemplo.com" required>
          </div>

          <div class="input-group">
            <label for="loginSenha">Palavra-passe</label>
            <input type="password" id="loginSenha" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn-cyber">Entrar no Painel</button>
        </form>

        <form id="formCadastro" class="auth-form hidden">
          <h2 class="auth-title">Crie a sua Conta</h2>
          <p class="auth-subtitle">Junte-se ao Pentagon e entre no ranking!</p>

          <div class="input-group">
            <label for="cadNome">Nome Completo</label>
            <input type="text" id="cadNome" placeholder="Seu nome ou Nickname" required>
          </div>

          <div class="input-group">
            <label for="cadEmail">Endereço de E-mail</label>
            <input type="email" id="cadEmail" placeholder="endereco@exemplo.com" required>
          </div>

          <div class="input-group">
            <label for="cadSenha">Palavra-passe</label>
            <input type="password" id="cadSenha" placeholder="••••••••" required>
          </div>

          <div class="input-group">
            <label for="cadConfirmaSenha">Confirme a Palavra-passe</label>
            <input type="password" id="cadConfirmaSenha" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn-cyber">Criar Conta</button>
        </form>

      </div>

    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pentagon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="#" class="logo-container">Pentagon.</a>
    <nav>
      <a href="#">HOME</a>
      <a href="#">SOBRE NÓS</a>
      <a href="#">CONTATO</a>
      <a href="index.html" class="active">ENTRAR</a>
    </nav>
  </header>

  <main class="auth-container">
    <h2>Entrar</h2>
    <form id="formCadastro">
      <div class="input-group">
        <label>Nome Completo</label>
        <input type="text" id="cadNome" placeholder="Maria Vitória" required>
      </div>
      <div class="input-group">
        <label>Endereço de E-mail</label>
        <input type="email" id="cadEmail" placeholder="endereco@gmail.com" required>
      </div>
      <div class="input-row">
        <div class="input-group">
          <label>Senha</label>
          <input type="password" id="cadSenha" placeholder="********" required>
        </div>
        <div class="input-group">
          <label>Confirme a Senha</label>
          <input type="password" id="cadConfirmaSenha" placeholder="********" required>
        </div>
      </div>
      <button type="submit" class="btn-primary">Criar Conta</button>
      <div class="divider"><span>Ou</span></div>
      <a href="dashboard.html" class="btn-secondary">Log in</a>
    </form>
  </main>

  <script src="js/mockData.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

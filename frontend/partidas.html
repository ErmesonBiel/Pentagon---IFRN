<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pentagon - Registrar Partida</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <a href="dashboard.html" class="logo-container">Pentagon.</a>
    <nav>
      <a href="dashboard.html">PAINEL</a>
      <a href="ranking.html">RANKING</a>
      <a href="partidas.html" class="active">PARTIDAS</a>
      <a href="perfil.html">PERFIL</a>
    </nav>
  </header>

  <main class="form-container">
    <h2 class="page-title">Registrar Resultados</h2>
    <form id="formPartida">

      <div class="input-group">
        <label for="j1">Jogador 1</label>
        <select id="j1" required>
          <option value="" disabled selected>Selecione o Jogador 1</option>
        </select>
      </div>

      <div class="input-group">
        <label for="j2">Jogador 2</label>
        <select id="j2" required>
          <option value="" disabled selected>Selecione o Jogador 2</option>
        </select>
      </div>

      <div class="input-group">
        <label for="vencedor">Vencedor</label>
        <select id="vencedor" required>
          <option value="" disabled selected>Selecione o Vencedor</option>
        </select>
      </div>

      <div class="input-group">
        <label for="placar">Placar</label>
        <input type="text" id="placar" placeholder="Ex:2 x 1" required>
      </div>

      <button type="submit" class="btn-primary">Salvar e Atualizar Ranking</button>
    </form>

    <section class="bracket-section" style="margin-top: 40px;">
      <h2 class="page-title" style="font-size: 1.5rem; margin-bottom: 20px;">Chaveamento do Torneio</h2>
      <div id="bracket-container" class="bracket-grid">
        <div class="round">
          <h3>Quartas de Final</h3>
          <div class="matchup"><span>Aguardando...</span></div>
          <div class="matchup"><span>Aguardando...</span></div>
        </div>
        <div class="round">
          <h3>Semifinais</h3>
          <div class="matchup"><span>Aguardando...</span></div>
        </div>
        <div class="round">
          <h3>Final</h3>
          <div class="matchup"><span>-</span></div>
        </div>
      </div>
    </section>  
  </main>

  <script src="js/mockData.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
